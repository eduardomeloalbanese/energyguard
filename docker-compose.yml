# ============================================================================
# EnergyGuard - Orquestracao base (desenvolvimento / demonstracao local)
#   docker compose up -d --build
# ============================================================================

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: energyguard-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no .env}
      MSSQL_PID: Express
    # Banco NAO exposto publicamente por padrao; descomente para depurar localmente.
    # ports:
    #   - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - energyguard-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null || /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE:-energyguard-api:local}
    container_name: energyguard-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Server=db;Database=${MSSQL_DB:-EnergyGuardDb};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: ${Jwt__Key:?defina Jwt__Key no .env}
      Jwt__Issuer: ${Jwt__Issuer:-EnergyGuard.API}
      Jwt__Audience: ${Jwt__Audience:-EnergyGuard.Client}
      Jwt__ExpirationHours: ${Jwt__ExpirationHours:-8}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - energyguard-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  energyguard-net:
    driver: bridge

volumes:
  mssql-data:
